name: Check sample views

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore Ignixa CLI
        run: dotnet tool restore
      - name: Install Parquet checker
        run: python -m pip install -r requirements-test.txt
      - name: Check mismatched contract identities
        run: python scripts/test_check_samples.py
      - name: Validate and inspect sample exports
        run: python scripts/check-samples.py
